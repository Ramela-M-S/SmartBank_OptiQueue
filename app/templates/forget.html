<!DOCTYPE html>
<html lang="en">
<head>
    <title>Forgot Password</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .card {
            background: white;
            padding: 25px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #021c38;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #06335f;
        }

        .eye {
            cursor: pointer;
            float: right;
            margin-top: -35px;
            margin-right: 10px;
        }

        .small-text {
            text-align: center;
            font-size: 12px;
            color: gray;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>Reset Password</h2>

    <!-- NEW PASSWORD -->
    <input id="newPassword" type="password" placeholder="Enter new password">
    <span class="eye" onclick="toggle('newPassword')">👁️</span>

    <!-- CONFIRM PASSWORD -->
    <input id="confirmPassword" type="password" placeholder="Confirm password">
    <span class="eye" onclick="toggle('confirmPassword')">👁️</span>

    <button onclick="resetPassword()">Update Password</button>

    <div class="small-text">
        After updating, go back to login page
    </div>

</div>

<script>
function toggle(id) {
    let field = document.getElementById(id);
    field.type = (field.type === "password") ? "text" : "password";
}

function resetPassword() {
    let user = JSON.parse(localStorage.getItem("smartbank_user"));

    let newPass = document.getElementById("newPassword").value;
    let confirmPass = document.getElementById("confirmPassword").value;

    if (!newPass || !confirmPass) {
        alert("Please fill all fields!");
        return;
    }

    if (newPass !== confirmPass) {
        alert("Passwords do not match!");
        return;
    }

    if (!user) {
        alert("No user found!");
        return;
    }

    user.password = newPass;
    localStorage.setItem("smartbank_user", JSON.stringify(user));

    alert("Password updated successfully!");
    window.location.href = "login.html";
}
</script>

</body>
</html>
