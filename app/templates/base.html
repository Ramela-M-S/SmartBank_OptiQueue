<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Bank Queue System{% endblock %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #f4f7fb;
        }

        /* NAVBAR */
        .navbar {
            background: #0b1f3a;
            padding: 14px 28px;
        }

        .navbar-brand {
            color: white !important;
            font-weight: 700;
        }

        .nav-link {
            color: rgba(255,255,255,0.8) !important;
        }

        .nav-link:hover {
            color: white !important;
        }

        .hero-img {
    width: 100%;
    height: 420px;
    object-fit: cover;
    display: block;
    border-bottom-left-radius: 30px;
    border-bottom-right-radius: 30px;
}

/* PAGE WRAP */
.wrap {
    max-width: 1100px;
    margin: auto;
    padding: 30px 20px;
}
.required::after {
    content: " *";
    color: red;
    font-weight: bold;
}

/* GLASS EFFECT CARD */
.glass-card {
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    padding: 30px;
}

/* ROLE CARD */
.role-card {
    border-radius: 18px;
    padding: 25px;
    text-align: center;
    transition: 0.3s;
    border: 1px solid #eef2f7;
    background: linear-gradient(145deg, #ffffff, #f9fbff);
}

.role-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 12px 25px rgba(0,0,0,0.1);
}

.role-icon {
    font-size: 34px;
    margin-bottom: 10px;
}

.btn-soft {
    border-radius: 12px;
    font-weight: 600;
}

    </style>

    {% block head %}{% endblock %}
</head>

<body>

<nav class="navbar navbar-expand-lg"
     style="background: linear-gradient(135deg, rgb(52, 52, 173), #05054a);">

    <div class="container-fluid">

        <!-- Brand -->
        <a class="navbar-brand fw-bold" href="/">
            🏦 SmartBank Queue
        </a>

        <!-- Right side links -->
        <div class="ms-auto d-flex align-items-center gap-4">

            <a class="nav-link d-inline text-dark" href="/">Home</a>
            <a class="nav-link d-inline text-dark" href="#">User</a>
            <a class="nav-link d-inline text-dark" href="#">Admin</a>
            <a class="nav-link d-inline text-dark" href="#">Staff</a>

            <a class="nav-link d-inline text-danger fw-semibold" href="#">
                Logout
            </a>

        </div>

    </div>
</nav>

{% block content %}{% endblock %}

</body>
</html>
