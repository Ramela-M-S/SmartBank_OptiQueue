<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Bank Queue System{% endblock %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #f4f7fb;
        }

      
        .navbar {
            background: #0b1f3a;
            padding: 14px 28px;
        }

        .navbar-brand {
            color: white !important;
            font-weight: 700;
        }

        .nav-link {
            color: rgba(255,255,255,0.8) !important;
        }

        .nav-link:hover {
            color: white !important;
        }

     


.wrap {
    max-width: 1100px;
    margin: auto;
    padding: 30px 20px;
}
.required::after {
    content: " *";
    color: red;
    font-weight: bold;
}


.glass-card {
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    padding: 30px;
}


.role-card {
    border-radius: 18px;
    padding: 25px;
    text-align: center;
    transition: 0.3s;
    border: 1px solid #eef2f7;
    background: linear-gradient(145deg, #ffffff, #f9fbff);
}

.role-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 12px 25px rgba(0,0,0,0.1);
}

.role-icon {
    font-size: 34px;
    margin-bottom: 10px;
}

.btn-soft {
    border-radius: 12px;
    font-weight: 600;
}
.container-fluid {
    padding: 0 !important;
}
.flash-container {
    position: fixed;
    top: 70px; /* below navbar */
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    width: 90%;
    max-width: 500px;
}

.flash-message {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    margin-bottom: 10px;
    border-radius: 8px;
    color: #fff;
    font-weight: 500;
    animation: slideDown 0.4s ease;
}


.alert-success { background-color: #28a745; }
.alert-danger { background-color: #dc3545; }
.alert-warning { background-color: #ffc107; color: #000; }

.close-btn {
    background: none;
    border: none;
    font-size: 20px;
    color: inherit;
    cursor: pointer;
}


@keyframes slideDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}
    </style>

    {% block head %}{% endblock %}
</head>

<body>

<nav class="navbar navbar-expand-lg"
     style="background: linear-gradient(135deg, rgb(52, 52, 173), #05054a);">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold" href="/">
            🏦 SmartBank Queue
        </a>

        <div class="ms-auto d-flex align-items-center gap-4">

            <a class="nav-link d-inline text-dark" href="/">Home</a>
            <a class="nav-link d-inline text-dark" href="{{url_for('user_dashboard')}}">User</a>
            <a class="nav-link d-inline text-dark" href="{{url_for('admin_dashboard')}}">Admin</a>
            <a class="nav-link d-inline text-dark" href="{{url_for('employee_dashboard')}}">Staff</a>

            <a class="nav-link d-inline text-danger fw-semibold" href="{{url_for('employee_dashboard')}}">
                Logout
            </a>

        </div>

    </div>
</nav>
<div class="flash-container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash-message alert alert-{{ category }}">
                    <span>{{ message }}</span>
                    <button class="close-btn">&times;</button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
</div>

{% block content %}{% endblock %}

</body>
</html>

<script>
    
    setTimeout(() => {
        document.querySelectorAll('.flash-message').forEach(msg => {
            msg.style.opacity = '0';
            msg.style.transition = '0.5s';
            setTimeout(() => msg.remove(), 500);
        });
    }, 3000);

 
    document.querySelectorAll('.close-btn').forEach(btn => {
        btn.addEventListener('click', function () {
            this.parentElement.remove();
        });
    });
</script>
