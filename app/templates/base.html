<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Bank Queue System{% endblock %}</title>

    <!-- 🔥 FIXED VIEWPORT (NO ZOOM ISSUE) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #f4f7fb;
        }

        /* NAVBAR */
        .navbar {
            padding: 14px 20px;
        }

        .navbar-brand {
            font-weight: 700;
        }

        .nav-link {
            color: rgba(255,255,255,0.85) !important;
        }

        .nav-link:hover {
            color: white !important;
        }

        .navbar-toggler {
    border: none;
}

.navbar-toggler:focus {
    box-shadow: none;
}

/* PURE WHITE ICON */
.navbar-toggler-icon {
    background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 30 30' xmlns='http://www.w3.org/2000/svg'%3e%3cpath stroke='rgba(255,255,255,1)' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
}

        /* MOBILE SIDE MENU */
        .mobile-menu {
            position: fixed;
            top: 0;
            left: -260px;
            width: 260px;
            height: 100%;
            background: #0b1f3a;
            padding: 20px;
            z-index: 9999;
            transition: 0.3s ease;
            color: white;
        }

        .mobile-menu.active {
            left: 0;
        }

        .mobile-menu a {
            display: block;
            padding: 12px 0;
            color: rgba(255,255,255,0.85);
            text-decoration: none;
        }

        .mobile-menu a:hover {
            color: white;
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            display: none;
            z-index: 9998;
        }

        #overlay.active {
            display: block;
        }

        @media (min-width: 992px) {
            .mobile-menu {
                display: none;
            }
        }

        /* CONTENT WRAP */
        .wrap {
            max-width: 1100px;
            margin: auto;
            padding: 30px 20px;
        }

        /* CARDS */
        .glass-card {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 25px;
        }

        .role-card {
            border-radius: 18px;
            padding: 25px;
            transition: 0.3s;
            border: 1px solid #eef2f7;
            background: #fff;
        }

        .role-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.1);
        }

        .role-icon {
            font-size: 32px;
        }

        .btn-soft {
            border-radius: 12px;
            font-weight: 600;
        }

        /* FLASH */
        .flash-container {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    width: 90%;
    max-width: 400px;
}

/* FLASH BOX */
.flash-message {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    margin-bottom: 10px;
    border-radius: 10px;
    color: #fff;
    font-weight: 500;
    animation: slideDown 0.4s ease;
}

/* COLORS */
.alert-success { background: #28a745; }
.alert-danger { background: #dc3545; }
.alert-warning { background: #ffc107; color: #000; }

/* CLOSE BUTTON */
.close-btn {
    background: none;
    border: none;
    font-size: 20px;
    color: inherit;
    cursor: pointer;
}

/* ANIMATION */
@keyframes slideDown {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

        .alert-success { background: #28a745; }
        .alert-danger { background: #dc3545; }
        .alert-warning { background: #ffc107; color: #000; }

    </style>

    {% block head %}{% endblock %}
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg sticky-top navbar-dark"
     style="background: linear-gradient(135deg, rgb(52, 52, 173), #05054a);">

    <div class="container-fluid">

        <a class="navbar-brand" href="/">🏦 SmartBank</a>

        <!-- MOBILE BUTTON -->
        <button class="navbar-toggler border-0" onclick="toggleMenu()">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="ms-auto d-none d-lg-flex align-items-center gap-4">

    <a class="nav-link" href="/">Home</a>
    <a class="nav-link" href="{{url_for('user_dashboard')}}">User</a>
    <a class="nav-link" href="{{url_for('admin_dashboard')}}">Admin</a>
    <a class="nav-link" href="{{url_for('employee_dashboard')}}">Staff</a>

    <a class="nav-link text-danger fw-semibold" href="/logout">
        Logout
    </a>

</div>

        </div>

    </div>
</nav>

<!-- MOBILE MENU -->
<div id="mobileMenu" class="mobile-menu">
    <div class="menu-header">
        <strong>Menu</strong>
        <span onclick="toggleMenu()">✕</span>
    </div>

    <a href="/">Home</a>
    <a href="{{url_for('user_dashboard')}}">User</a>
    <a href="{{url_for('admin_dashboard')}}">Admin</a>
    <a href="{{url_for('employee_dashboard')}}">Staff</a>

    <hr style="border-color: rgba(255,255,255,0.2);">

    <a href="/logout" class="text-danger fw-semibold">
        Logout
    </a>
</div>

<div id="overlay" onclick="toggleMenu()"></div>

<!-- FLASH -->
<div class="flash-container">
{% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
        <div class="flash-message alert-{{ category }}">
            <span>{{ message }}</span>
            <button class="close-btn">&times;</button>
        </div>
    {% endfor %}
{% endwith %}
</div>

{% block content %}{% endblock %}

<script>
function toggleMenu() {
    document.getElementById("mobileMenu").classList.toggle("active");
    document.getElementById("overlay").classList.toggle("active");
}

/* AUTO CLOSE AFTER 3s */
setTimeout(() => {
    document.querySelectorAll('.flash-message').forEach(msg => {
        msg.style.opacity = '0';
        msg.style.transition = '0.5s';
        setTimeout(() => msg.remove(), 500);
    });
}, 3000);

/* MANUAL CLOSE */
document.querySelectorAll('.close-btn').forEach(btn => {
    btn.addEventListener('click', function () {
        this.parentElement.remove();
    });
});

/* MOBILE MENU CLOSE ON CLICK */
document.querySelectorAll(".mobile-menu a").forEach(link => {
    link.addEventListener("click", toggleMenu);
});
</script>

</body>
</html>
