{% extends "base.html" %}

{% block content %}

<!-- HERO -->
<div class="hero-section">
    <div class="hero-bg"></div>

    <div class="hero-overlay">
        <div class="glass-hero text-center">
            <h1 class="fw-bold text-white"> SmartBank OptiQueue</h1>
            <p class="text-light">Skip the queue, not your turn</p>

            <a href="#main-content" class="btn btn-primary mt-3 px-4">
                Get Started
            </a>
        </div>
    </div>
</div>

<!-- CONTENT -->
<div class="wrap" id="main-content">

    <div class="glass-card text-center">

        <div class="row g-4 mt-2">

            <div class="col-12 col-md-4">
                <div class="role-card">
                    <div class="role-icon">👤</div>
                    <h5>User</h5>
                    <p class="text-muted">Book tokens & track queue</p>
                    <a href="/login?role=user" class="btn btn-primary btn-soft w-100">Login</a>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="role-card">
                    <div class="role-icon">👨‍💼</div>
                    <h5>Staff</h5>
                    <p class="text-muted">Manage queue</p>
                    <a href="/login?role=staff" class="btn btn-primary btn-soft w-100">Login</a>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="role-card">
                    <div class="role-icon">👑</div>
                    <h5>Admin</h5>
                    <p class="text-muted">System analytics</p>
                    <a href="/login?role=admin" class="btn btn-primary btn-soft w-100">Login</a>
                </div>
            </div>

        </div>
    </div>

    <div class="glass-card text-center mt-4">
        <h5 class="fw-bold">New here?</h5>
        <p class="text-muted">Create account to start using queue system</p>

        <a href="/register" class="btn btn-primary px-4">
            Register
        </a>
    </div>

</div>

<style>
/* HERO */
.hero-section {
    position: relative;
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.hero-bg {
    position: absolute;
    inset: 0;
    background: url("{{ url_for('static', filename='images/Queue.jpeg') }}") center/cover no-repeat;
    transform: scale(1.05);
}

.hero-bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.45);
}

.hero-overlay {
    position: relative;
    z-index: 2;
    padding: 20px;
}

.glass-hero {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 40px;
    max-width: 600px;
}

/* MOBILE */
@media (max-width: 768px) {
    .hero-section {
        min-height: 70vh;
    }

    .glass-hero {
        padding: 25px;
    }

    .glass-hero h1 {
        font-size: 1.8rem;
    }
}
</style>

{% endblock %}
