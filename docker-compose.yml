version: '3.8'

services:
  web:
    build: .
    container_name: smart_bank_queue
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=production-secret-bank-key-ghci-2026
      - DATABASE_URL=sqlite:///instance/bank_queue.db
    volumes:
      - ./instance:/app/instance